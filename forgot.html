<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Glassmorphism UI</title>
  <meta name="description" content="Reset your password." />
  <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("auth_theme") === "light" ? "light" : "");</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    .forgot-page {
      max-width: 420px;
      margin: 60px auto;
      padding: 40px 32px 32px;
    }
    .forgot-page .success-msg {
      display: none;
      text-align: center;
      padding: 24px 0 8px;
      outline: none;
    }
    .forgot-page .success-msg i {
      font-size: 3rem;
      color: #22c55e;
      margin-bottom: 12px;
    }
    .forgot-page .success-msg p {
      color: var(--text);
      font-size: 0.95rem;
      line-height: 1.6;
    }
    .forgot-page.sent .form-wrap {
      display: none;
    }
    .forgot-page.sent .success-msg {
      display: block;
    }
    @media (max-width: 480px) {
      .forgot-page {
        margin: 24px auto;
        padding: 32px 20px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
  </div>

  <main class="forgot-page panel" id="forgotPage">
    <div class="form-wrap">
      <div class="avatar"><i class="fa-solid fa-key"></i></div>
      <h1 class="title gradient-text">Forgot Password</h1>
      <p class="subtitle">Enter your email and we'll send you a reset link.</p>

      <form id="resetForm" novalidate>
        <div class="field">
          <div class="field-input">
            <input type="email" id="resetEmail" class="input" placeholder=" " required inputmode="email" maxlength="254" autocorrect="off" autocapitalize="off" spellcheck="false" autocomplete="email" aria-describedby="resetEmailErr" />
            <label for="resetEmail">Email address</label>
            <span class="icon"><i class="fa-regular fa-envelope" aria-hidden="true"></i></span>
          </div>
          <span class="error-text" id="resetEmailErr"></span>
        </div>

        <button type="submit" class="btn" id="sendResetBtn">
          <span class="btn-text">Send Reset Link</span>
          <i class="fa-solid fa-circle-notch btn-spinner"></i>
        </button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to Login</a>
    </div>

    <div class="success-msg" tabindex="-1" role="status">
      <i class="fa-regular fa-circle-check"></i>
      <p>If an account with that email exists,<br />we've sent a reset link.</p>
      <a href="index.html" class="back-link" style="margin-top:24px">&larr; Back to Login</a>
    </div>
  </main>

  <script>
    (function () {
      var form = document.getElementById("resetForm");
      var email = document.getElementById("resetEmail");
      var btn = document.getElementById("sendResetBtn");
      var errText = document.getElementById("resetEmailErr");

      function markInvalid(show, msg) {
        email.classList.toggle("error", show);
        email.setAttribute("aria-invalid", show ? "true" : "false");
        errText.textContent = show ? msg : "";
        if (show) {
          email.classList.remove("shake");
          void email.offsetWidth;
          email.classList.add("shake");
        }
      }

      function clearErr() {
        markInvalid(false);
        email.removeEventListener("input", clearErr);
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (btn.disabled) return;
        var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
        if (!valid) {
          markInvalid(true, "Valid email required");
          email.addEventListener("input", clearErr);
          email.focus();
          return;
        }
        markInvalid(false);
        btn.classList.add("loading");
        btn.disabled = true;
        form.setAttribute("aria-busy", "true");
        setTimeout(function () {
          document.getElementById("forgotPage").classList.add("sent");
          var success = document.querySelector(".success-msg");
          if (success) success.focus();
        }, 1200);
      });
    })();
  </script>
</body>
</html>
